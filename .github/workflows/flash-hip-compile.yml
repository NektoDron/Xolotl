name: Flash GBNF pinned HIP compile only
on:
  push:
    branches: ['ci/flash-gbnf-hip-1103']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hip-compile:
    if: github.repository == 'NektoDron/Xolotl'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      FLASH_SOURCE_SHA: 1290e14f886c326ef8484f00004562bb2407be5b
      FLASH_LLAMA_SHA: 6050b467c07a95c7b87debd4ddac2f8ba8d9b807
    steps:
      - name: Checkout qualification harness
        uses: actions/checkout@v4
        with:
          path: qualification
          persist-credentials: false
      - name: Checkout exact Flash source
        uses: actions/checkout@v4
        with:
          repository: NektoDron/Xolotl
          ref: 1290e14f886c326ef8484f00004562bb2407be5b
          path: source
          persist-credentials: false
      - name: Pinned SDK preflight and HIP OFF/ON compile
        shell: bash
        run: bash qualification/tools/ci/flash_hip_compile.sh "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/evidence"
      - name: Preserve receipts and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flash-1290e14-hip-compile-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
